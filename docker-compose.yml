services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: realtylead
      POSTGRES_PASSWORD: realtylead
      POSTGRES_DB: realtylead
    ports:
      # Override POSTGRES_PORT in .env if you already run Postgres on 5432.
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U realtylead -d realtylead"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://realtylead:realtylead@postgres:5432/realtylead
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  worker:
    build:
      context: ./backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://realtylead:realtylead@postgres:5432/realtylead
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    volumes:
      - ./backend:/app
    # The API applies migrations on startup; the worker just polls the queue.
    command: python -m app.workers.followup_worker
    # The image's HEALTHCHECK curls the API port, which this service does not
    # serve — without overriding it the worker is permanently "unhealthy".
    # Reading /proc/1 rather than using pgrep: procps is not in the slim image,
    # and matching only PID 1 avoids the check matching its own command line.
    healthcheck:
      test: ["CMD-SHELL", "grep -qa followup_worker /proc/1/cmdline || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  pgdata:
